# Codecov Configuration
# https://docs.codecov.com/docs/codecovyml-reference

coverage:
  precision: 2
  round: down
  range: "60...100"

  status:
    project:
      default:
        target: auto
        threshold: 5%  # Allow 5% decrease before failing
        if_ci_failed: error
    patch:
      default:
        target: 80%  # New code should have 80% coverage
        threshold: 10%

# Component-specific settings
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
  individual_components:
    - component_id: backend
      name: Backend
      paths:
        - backend/**
    - component_id: frontend
      name: Frontend
      paths:
        - frontend/src/**

# Ignore files from coverage
ignore:
  - "**/__pycache__/**"
  - "**/tests/**"
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/migrations/**"
  - "**/node_modules/**"
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/__tests__/**"

# Comment configuration for PRs
comment:
  layout: "reach,diff,flags,files"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true
