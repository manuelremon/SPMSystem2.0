# SPM v3.0 - Docker Compose de Produccion
# Oracle Cloud VPS con PostgreSQL + Flask + Nginx
version: '3.8'

services:
  # === Redis (Message Broker for Celery) ===
  redis:
    image: redis:7-alpine
    container_name: spm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - spm-network

  # === PostgreSQL Database ===
  postgres:
    image: postgres:16-alpine
    container_name: spm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-spm_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spm}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - spm-network

  # === Backend Flask + Gunicorn ===
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
    container_name: spm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-spm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spm_production}
      # Redis / Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      # Security
      SECRET_KEY: ${SECRET_KEY:?error}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?error}
      # Flask
      FLASK_ENV: production
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Push Notifications (opcional)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
      # Gunicorn (ajustado para VPS 1GB RAM)
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      # Rate Limiting (opcional, desactivar con DISABLE_RATE_LIMIT=1)
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-0}
      # Vertex IA (Google Gemini)
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    volumes:
      - spm_uploads:/app/uploads
      - spm_logs:/app/logs
      - spm_vapid:/app/data/vapid
      # Datos SAP ahora viven en PostgreSQL (migración 033)
    networks:
      - spm-network
    expose:
      - "5000"

  # === Celery Worker (Background Tasks) ===
  celery-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
    container_name: spm-celery-worker
    restart: unless-stopped
    command: celery -A backend.core.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.core.celery_app inspect ping --timeout=10 || exit 1"]
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-spm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spm_production}
      # Redis / Celery
      REDIS_URL: redis://redis:6379/0
      CELERY_ENABLED: "true"
      # Security
      SECRET_KEY: ${SECRET_KEY:?error}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?error}
      # Flask
      FLASK_ENV: production
      # SMTP (for email tasks)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      # Vertex IA (Google Gemini)
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    volumes:
      - spm_logs:/app/logs
    networks:
      - spm-network

  # === Celery Beat (Periodic Task Scheduler) ===
  celery-beat:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
    container_name: spm-celery-beat
    restart: unless-stopped
    command: celery -A backend.core.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat-schedule || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-spm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spm_production}
      CELERY_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:?error}
      FLASK_ENV: production
    volumes:
      - spm_logs:/app/logs
    networks:
      - spm-network

  # === Nginx Reverse Proxy ===
  nginx:
    image: nginx:alpine
    container_name: spm-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      # SSL Certificates (Let's Encrypt)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot challenge directory
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - spm-network

# === Volumes ===
volumes:
  redis_data:
    name: spm_redis_data
  postgres_data:
    name: spm_postgres_data
  spm_uploads:
    name: spm_uploads
  spm_logs:
    name: spm_logs
  spm_vapid:
    name: spm_vapid

# === Networks ===
networks:
  spm-network:
    driver: bridge
    name: spm_network
