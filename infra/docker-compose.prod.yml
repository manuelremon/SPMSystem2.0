# SPM v2.0 - Docker Compose de Produccion
# Oracle Cloud VPS con PostgreSQL + Flask + Nginx
version: '3.8'

services:
  # === PostgreSQL Database ===
  postgres:
    image: postgres:16-alpine
    container_name: spm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-spm_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spm-network

  # === Backend Flask + Gunicorn ===
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
    container_name: spm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-spm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spm_production}
      # Security
      SECRET_KEY: ${SECRET_KEY:?error}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?error}
      # Flask
      FLASK_ENV: production
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # Push Notifications (opcional)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
      # Rate Limiting (opcional, desactivar con DISABLE_RATE_LIMIT=1)
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-0}
    volumes:
      - spm_uploads:/app/uploads
      - spm_logs:/app/logs
      - spm_vapid:/app/data/vapid
      # SQLite databases (read-only) - Datos SAP
      - ../data/sap_data.db:/app/data/sap_data.db:ro
      - ../data/equivalentes.db:/app/data/equivalentes.db:ro
      - ../data/catalogo_materiales.db:/app/data/catalogo_materiales.db:ro
    networks:
      - spm-network
    expose:
      - "5000"

  # === Nginx Reverse Proxy ===
  nginx:
    image: nginx:alpine
    container_name: spm-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
      # SSL Certificates (Let's Encrypt)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot challenge directory
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - spm-network

# === Volumes ===
volumes:
  postgres_data:
    name: spm_postgres_data
  spm_uploads:
    name: spm_uploads
  spm_logs:
    name: spm_logs
  spm_vapid:
    name: spm_vapid

# === Networks ===
networks:
  spm-network:
    driver: bridge
    name: spm_network
