# SPM v3.0 - Docker Compose para Acceso por IP (Sin SSL)
# IP: <SERVER_IP>
# PostgreSQL + Flask + Nginx (HTTP only)
version: '3.8'

services:
  # === PostgreSQL Database ===
  postgres:
    image: postgres:16-alpine
    container_name: spm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-spm_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spm}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - spm-network

  # === Backend Flask + Gunicorn ===
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.prod
    container_name: spm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-spm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spm_production}
      # Security
      SECRET_KEY: ${SECRET_KEY:?error}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?error}
      # Flask
      FLASK_ENV: production
      # CORS - IP Access
      CORS_ORIGINS: ${CORS_ORIGINS:-http://<SERVER_IP>}
      # Push Notifications (opcional)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL: ${VAPID_EMAIL:-}
    volumes:
      - spm_uploads:/app/uploads
      - spm_logs:/app/logs
    networks:
      - spm-network
    expose:
      - "5000"

  # === Nginx Reverse Proxy (HTTP Only) ===
  nginx:
    image: nginx:alpine
    container_name: spm-nginx
    restart: unless-stopped
    volumes:
      # Config sin SSL para acceso por IP
      - ./nginx/default-ip.conf:/etc/nginx/conf.d/default.conf:ro
      # Frontend build
      - ../frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - spm-network

# === Volumes ===
volumes:
  postgres_data:
    name: spm_postgres_data
  spm_uploads:
    name: spm_uploads
  spm_logs:
    name: spm_logs

# === Networks ===
networks:
  spm-network:
    driver: bridge
    name: spm_network
