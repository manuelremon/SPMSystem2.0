<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Válvula de bola industrial -->
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a0a0a0"/>
      <stop offset="50%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
  </defs>
  <!-- Cuerpo de la válvula -->
  <ellipse cx="50" cy="55" rx="25" ry="20" fill="url(#metal)" stroke="#444" stroke-width="2"/>
  <!-- Conexiones -->
  <rect x="10" y="48" width="15" height="14" fill="url(#metal)" stroke="#444" stroke-width="1.5"/>
  <rect x="75" y="48" width="15" height="14" fill="url(#metal)" stroke="#444" stroke-width="1.5"/>
  <!-- Volante -->
  <circle cx="50" cy="30" r="12" fill="none" stroke="#cc0000" stroke-width="4"/>
  <line x1="50" y1="18" x2="50" y2="42" stroke="#cc0000" stroke-width="3"/>
  <line x1="38" y1="30" x2="62" y2="30" stroke="#cc0000" stroke-width="3"/>
  <!-- Vástago -->
  <rect x="47" y="35" width="6" height="15" fill="#666"/>
</svg>
