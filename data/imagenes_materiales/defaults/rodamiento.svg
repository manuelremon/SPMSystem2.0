<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Rodamiento de bolas -->
  <defs>
    <linearGradient id="steel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b0b0b0"/>
      <stop offset="50%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
  </defs>
  <!-- Aro exterior -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#steel)" stroke-width="8"/>
  <!-- Aro interior -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="url(#steel)" stroke-width="6"/>
  <!-- Bolas -->
  <circle cx="50" cy="20" r="6" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
  <circle cx="75" cy="35" r="6" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
  <circle cx="75" cy="65" r="6" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
  <circle cx="50" cy="80" r="6" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
  <circle cx="25" cy="65" r="6" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
  <circle cx="25" cy="35" r="6" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
  <!-- Centro -->
  <circle cx="50" cy="50" r="8" fill="#888"/>
</svg>
