<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Polea -->
  <defs>
    <linearGradient id="pulleyMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#909090"/>
      <stop offset="50%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#606060"/>
    </linearGradient>
  </defs>
  <!-- Disco de la polea -->
  <circle cx="50" cy="50" r="40" fill="url(#pulleyMetal)" stroke="#444" stroke-width="2"/>
  <!-- Ranura para correa -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#555" stroke-width="6"/>
  <!-- Centro -->
  <circle cx="50" cy="50" r="12" fill="url(#pulleyMetal)" stroke="#444" stroke-width="2"/>
  <!-- Cuñero -->
  <rect x="45" y="44" width="10" height="12" fill="#333"/>
  <!-- Agujero central -->
  <circle cx="50" cy="50" r="6" fill="#333"/>
</svg>
