<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Tuerca hexagonal -->
  <defs>
    <linearGradient id="nutSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b0b0b0"/>
      <stop offset="50%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
  </defs>
  <!-- Hexágono exterior -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" fill="url(#nutSteel)" stroke="#444" stroke-width="2"/>
  <!-- Orificio central con rosca -->
  <circle cx="50" cy="50" r="18" fill="#333"/>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="50" cy="50" r="13" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="50" cy="50" r="10" fill="none" stroke="#555" stroke-width="1"/>
</svg>
