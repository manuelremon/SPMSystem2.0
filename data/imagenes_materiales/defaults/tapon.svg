<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Tapón hexagonal -->
  <defs>
    <linearGradient id="plugMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a0a0a0"/>
      <stop offset="50%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#707070"/>
    </linearGradient>
  </defs>
  <!-- Cabeza hexagonal -->
  <polygon points="50,20 75,35 75,55 50,70 25,55 25,35" fill="url(#plugMetal)" stroke="#444" stroke-width="2"/>
  <!-- Parte roscada -->
  <rect x="40" y="65" width="20" height="25" fill="url(#plugMetal)" stroke="#444" stroke-width="1"/>
  <!-- Roscas -->
  <line x1="40" y1="72" x2="60" y2="72" stroke="#888" stroke-width="0.8"/>
  <line x1="40" y1="78" x2="60" y2="78" stroke="#888" stroke-width="0.8"/>
  <line x1="40" y1="84" x2="60" y2="84" stroke="#888" stroke-width="0.8"/>
</svg>
