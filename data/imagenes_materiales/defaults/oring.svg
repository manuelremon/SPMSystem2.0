<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- O-Ring de goma -->
  <defs>
    <radialGradient id="oringRubber" cx="50%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#444"/>
      <stop offset="100%" style="stop-color:#111"/>
    </radialGradient>
  </defs>
  <!-- Anillo exterior -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#oringRubber)" stroke-width="12"/>
  <!-- Brillo -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="20,60" stroke-dashoffset="10"/>
</svg>
