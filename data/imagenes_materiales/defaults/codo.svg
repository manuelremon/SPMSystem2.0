<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Codo de tubería 90° -->
  <defs>
    <linearGradient id="elbowSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b0b0b0"/>
      <stop offset="50%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
  </defs>
  <!-- Codo curvado -->
  <path d="M 20 80 L 20 50 Q 20 20 50 20 L 80 20" fill="none" stroke="url(#elbowSteel)" stroke-width="18" stroke-linecap="round"/>
  <!-- Borde exterior -->
  <path d="M 20 80 L 20 50 Q 20 20 50 20 L 80 20" fill="none" stroke="#555" stroke-width="20" stroke-linecap="round" opacity="0.3"/>
  <!-- Brillo -->
  <path d="M 20 80 L 20 50 Q 20 20 50 20 L 80 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
</svg>
