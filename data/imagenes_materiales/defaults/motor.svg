<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Motor eléctrico -->
  <defs>
    <linearGradient id="motorBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3060a0"/>
      <stop offset="100%" style="stop-color:#204060"/>
    </linearGradient>
  </defs>
  <!-- Cuerpo del motor -->
  <rect x="20" y="25" width="50" height="50" rx="3" fill="url(#motorBody)" stroke="#222" stroke-width="2"/>
  <!-- Aletas de enfriamiento -->
  <rect x="22" y="30" width="46" height="3" fill="#5080c0"/>
  <rect x="22" y="38" width="46" height="3" fill="#5080c0"/>
  <rect x="22" y="46" width="46" height="3" fill="#5080c0"/>
  <rect x="22" y="54" width="46" height="3" fill="#5080c0"/>
  <rect x="22" y="62" width="46" height="3" fill="#5080c0"/>
  <!-- Tapa trasera -->
  <ellipse cx="20" cy="50" rx="8" ry="25" fill="#404040"/>
  <!-- Eje -->
  <rect x="70" y="45" width="20" height="10" fill="#aaa" stroke="#666" stroke-width="1"/>
  <!-- Caja de bornes -->
  <rect x="35" y="15" width="20" height="10" fill="#333"/>
</svg>
