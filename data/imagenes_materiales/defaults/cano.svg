<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Tubería/Caño de acero -->
  <defs>
    <linearGradient id="pipeSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0a0a0"/>
      <stop offset="30%" style="stop-color:#e0e0e0"/>
      <stop offset="70%" style="stop-color:#909090"/>
      <stop offset="100%" style="stop-color:#606060"/>
    </linearGradient>
  </defs>
  <!-- Tubo principal -->
  <rect x="5" y="35" width="90" height="30" fill="url(#pipeSteel)" stroke="#444" stroke-width="2"/>
  <!-- Extremos biselados -->
  <ellipse cx="5" cy="50" rx="5" ry="15" fill="#808080" stroke="#444" stroke-width="1"/>
  <ellipse cx="95" cy="50" rx="5" ry="15" fill="#c0c0c0" stroke="#444" stroke-width="1"/>
  <!-- Interior visible -->
  <ellipse cx="95" cy="50" rx="3" ry="10" fill="#333"/>
</svg>
