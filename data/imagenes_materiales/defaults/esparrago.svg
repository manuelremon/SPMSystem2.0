<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Espárrago (stud bolt) -->
  <defs>
    <linearGradient id="studSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#909090"/>
      <stop offset="50%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#707070"/>
    </linearGradient>
  </defs>
  <!-- Vástago roscado -->
  <rect x="45" y="10" width="10" height="80" fill="url(#studSteel)" stroke="#444" stroke-width="1"/>
  <!-- Roscas (todo el cuerpo) -->
