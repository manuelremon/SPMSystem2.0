    <line x1="45" y1="15" x2="55" y2="15"/>
    <line x1="45" y1="20" x2="55" y2="20"/>
    <line x1="45" y1="25" x2="55" y2="25"/>
    <line x1="45" y1="30" x2="55" y2="30"/>
    <line x1="45" y1="35" x2="55" y2="35"/>
    <line x1="45" y1="40" x2="55" y2="40"/>
    <line x1="45" y1="45" x2="55" y2="45"/>
    <line x1="45" y1="50" x2="55" y2="50"/>
    <line x1="45" y1="55" x2="55" y2="55"/>
    <line x1="45" y1="60" x2="55" y2="60"/>
    <line x1="45" y1="65" x2="55" y2="65"/>
    <line x1="45" y1="70" x2="55" y2="70"/>
    <line x1="45" y1="75" x2="55" y2="75"/>
    <line x1="45" y1="80" x2="55" y2="80"/>
