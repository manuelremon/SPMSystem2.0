<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Conjunto/Kit de piezas -->
  <defs>
    <linearGradient id="partsMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#909090"/>
      <stop offset="100%" style="stop-color:#606060"/>
    </linearGradient>
  </defs>
  <!-- Caja contenedora -->
  <rect x="10" y="20" width="80" height="60" rx="3" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
  <!-- Pieza 1 - Tornillo -->
  <rect x="18" y="30" width="6" height="20" fill="url(#partsMetal)" stroke="#444" stroke-width="1"/>
  <!-- Pieza 2 - Tuerca -->
  <polygon points="35,35 42,38 42,47 35,50 28,47 28,38" fill="url(#partsMetal)" stroke="#444" stroke-width="1"/>
  <!-- Pieza 3 - Arandela -->
  <circle cx="55" cy="42" r="8" fill="url(#partsMetal)" stroke="#444" stroke-width="1"/>
  <circle cx="55" cy="42" r="3" fill="#333"/>
  <!-- Pieza 4 - O-ring -->
  <circle cx="75" cy="42" r="7" fill="none" stroke="#333" stroke-width="4"/>
  <!-- Etiqueta -->
  <rect x="25" y="58" width="50" height="12" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="50" y="67" font-family="Arial" font-size="7" fill="#666" text-anchor="middle">KIT</text>
</svg>
