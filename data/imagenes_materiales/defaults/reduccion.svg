<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Reducción de tubería -->
  <defs>
    <linearGradient id="reducerSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0a0a0"/>
      <stop offset="50%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
  </defs>
  <!-- Cono de reducción -->
  <path d="M 10 30 L 10 70 L 90 55 L 90 45 Z" fill="url(#reducerSteel)" stroke="#444" stroke-width="2"/>
  <!-- Extremo grande -->
  <ellipse cx="10" cy="50" rx="5" ry="20" fill="#909090" stroke="#444" stroke-width="1"/>
  <!-- Extremo pequeño -->
  <ellipse cx="90" cy="50" rx="3" ry="10" fill="#c0c0c0" stroke="#444" stroke-width="1"/>
  <!-- Interior -->
  <ellipse cx="90" cy="50" rx="2" ry="7" fill="#333"/>
</svg>
