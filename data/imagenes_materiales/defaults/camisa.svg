<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Camisa de cilindro -->
  <defs>
    <linearGradient id="sleeveSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#808080"/>
      <stop offset="30%" style="stop-color:#c0c0c0"/>
      <stop offset="70%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
  </defs>
  <!-- Cilindro exterior -->
  <rect x="25" y="15" width="50" height="70" fill="url(#sleeveSteel)" stroke="#444" stroke-width="2"/>
  <!-- Interior hueco -->
  <rect x="35" y="15" width="30" height="70" fill="#555"/>
  <!-- Bordes superior e inferior -->
  <rect x="20" y="10" width="60" height="10" fill="url(#sleeveSteel)" stroke="#444" stroke-width="1"/>
  <rect x="20" y="80" width="60" height="10" fill="url(#sleeveSteel)" stroke="#444" stroke-width="1"/>
</svg>
