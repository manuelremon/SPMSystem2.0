<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Arandela plana -->
  <defs>
    <linearGradient id="washerSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#f0f0f0"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
  </defs>
  <!-- Disco exterior -->
  <circle cx="50" cy="50" r="40" fill="url(#washerSteel)" stroke="#666" stroke-width="2"/>
  <!-- Orificio central -->
  <circle cx="50" cy="50" r="15" fill="#333"/>
  <!-- Efecto 3D -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
</svg>
