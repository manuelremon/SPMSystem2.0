<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Módulo electrónico -->
  <defs>
    <linearGradient id="moduleBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a5a2a"/>
      <stop offset="100%" style="stop-color:#1a3a1a"/>
    </linearGradient>
  </defs>
  <!-- PCB -->
  <rect x="15" y="25" width="70" height="50" rx="2" fill="url(#moduleBody)" stroke="#0a2a0a" stroke-width="2"/>
  <!-- Componentes -->
  <rect x="22" y="32" width="12" height="8" fill="#222"/>
  <rect x="40" y="32" width="20" height="12" fill="#333"/>
  <circle cx="72" cy="38" r="6" fill="#444"/>
  <!-- Pines de conexión -->
  <rect x="20" y="55" width="4" height="15" fill="#c0a000"/>
  <rect x="30" y="55" width="4" height="15" fill="#c0a000"/>
  <rect x="40" y="55" width="4" height="15" fill="#c0a000"/>
  <rect x="50" y="55" width="4" height="15" fill="#c0a000"/>
  <rect x="60" y="55" width="4" height="15" fill="#c0a000"/>
  <rect x="70" y="55" width="4" height="15" fill="#c0a000"/>
  <!-- LED -->
  <circle cx="28" cy="50" r="3" fill="#00ff00"/>
</svg>
