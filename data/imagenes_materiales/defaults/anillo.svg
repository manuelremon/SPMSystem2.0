<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Anillo de retención (snap ring) -->
  <defs>
    <linearGradient id="ringSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#909090"/>
      <stop offset="50%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#606060"/>
    </linearGradient>
  </defs>
  <!-- Anillo con abertura -->
  <path d="M 85 50 A 35 35 0 1 1 75 25" fill="none" stroke="url(#ringSteel)" stroke-width="8" stroke-linecap="round"/>
  <!-- Orejas para instalación -->
  <circle cx="85" cy="50" r="5" fill="url(#ringSteel)" stroke="#444" stroke-width="1"/>
  <circle cx="75" cy="25" r="5" fill="url(#ringSteel)" stroke="#444" stroke-width="1"/>
  <!-- Agujeros -->
  <circle cx="85" cy="50" r="2" fill="#333"/>
  <circle cx="75" cy="25" r="2" fill="#333"/>
</svg>
