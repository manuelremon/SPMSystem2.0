<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Elemento genérico (pieza) -->
  <defs>
    <linearGradient id="elemMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a0a0a0"/>
      <stop offset="50%" style="stop-color:#d0d0d0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
  </defs>
  <!-- Forma de pieza mecanizada -->
  <path d="M 20 30 L 80 30 L 80 50 L 60 50 L 60 70 L 40 70 L 40 50 L 20 50 Z" fill="url(#elemMetal)" stroke="#444" stroke-width="2"/>
  <!-- Agujeros -->
  <circle cx="30" cy="40" r="5" fill="#333"/>
  <circle cx="70" cy="40" r="5" fill="#333"/>
  <circle cx="50" cy="60" r="5" fill="#333"/>
</svg>
