<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Niple roscado -->
  <defs>
    <linearGradient id="nipleMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a0a0a0"/>
      <stop offset="40%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#808080"/>
    </linearGradient>
  </defs>
  <!-- Cuerpo hexagonal central -->
  <polygon points="40,35 60,35 68,50 60,65 40,65 32,50" fill="url(#nipleMetal)" stroke="#444" stroke-width="1.5"/>
  <!-- Extremos roscados -->
  <rect x="15" y="42" width="20" height="16" fill="url(#nipleMetal)" stroke="#444" stroke-width="1"/>
  <rect x="65" y="42" width="20" height="16" fill="url(#nipleMetal)" stroke="#444" stroke-width="1"/>
  <!-- Roscas -->
  <line x1="18" y1="45" x2="32" y2="45" stroke="#888" stroke-width="0.5"/>
  <line x1="18" y1="49" x2="32" y2="49" stroke="#888" stroke-width="0.5"/>
  <line x1="18" y1="53" x2="32" y2="53" stroke="#888" stroke-width="0.5"/>
  <line x1="68" y1="45" x2="82" y2="45" stroke="#888" stroke-width="0.5"/>
  <line x1="68" y1="49" x2="82" y2="49" stroke="#888" stroke-width="0.5"/>
  <line x1="68" y1="53" x2="82" y2="53" stroke="#888" stroke-width="0.5"/>
</svg>
