<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Cable eléctrico -->
  <defs>
    <linearGradient id="cableOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#333"/>
      <stop offset="100%" style="stop-color:#111"/>
    </linearGradient>
  </defs>
  <!-- Aislamiento exterior -->
  <ellipse cx="50" cy="50" rx="35" ry="35" fill="url(#cableOuter)" stroke="#000" stroke-width="2"/>
  <!-- Conductores internos -->
  <circle cx="35" cy="35" r="8" fill="#bf6000" stroke="#8b4513" stroke-width="1"/>
  <circle cx="65" cy="35" r="8" fill="#bf6000" stroke="#8b4513" stroke-width="1"/>
  <circle cx="35" cy="65" r="8" fill="#bf6000" stroke="#8b4513" stroke-width="1"/>
  <circle cx="65" cy="65" r="8" fill="#bf6000" stroke="#8b4513" stroke-width="1"/>
  <!-- Centro de relleno -->
  <circle cx="50" cy="50" r="10" fill="#666"/>
</svg>
