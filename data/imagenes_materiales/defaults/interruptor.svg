<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Interruptor eléctrico (MCB) -->
  <defs>
    <linearGradient id="mcbBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#404040"/>
      <stop offset="100%" style="stop-color:#202020"/>
    </linearGradient>
  </defs>
  <!-- Cuerpo -->
  <rect x="25" y="10" width="50" height="80" rx="3" fill="url(#mcbBody)" stroke="#111" stroke-width="2"/>
  <!-- Palanca -->
  <rect x="40" y="30" width="20" height="25" rx="2" fill="#f0f0f0" stroke="#888" stroke-width="1"/>
  <text x="50" y="47" font-family="Arial" font-size="10" fill="#333" text-anchor="middle">ON</text>
  <!-- Indicador -->
  <rect x="35" y="60" width="30" height="8" fill="#00aa00"/>
  <!-- Terminales -->
  <rect x="35" y="5" width="8" height="8" fill="#c0c0c0"/>
  <rect x="57" y="5" width="8" height="8" fill="#c0c0c0"/>
  <rect x="35" y="87" width="8" height="8" fill="#c0c0c0"/>
  <rect x="57" y="87" width="8" height="8" fill="#c0c0c0"/>
</svg>
