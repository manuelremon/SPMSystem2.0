name: Run Database Migration

on:
  workflow_dispatch:
    inputs:
      migration_script:
        description: 'Migration script to run (e.g., 021_rename_centros.py)'
        required: true
        default: '021_rename_centros.py'

jobs:
  run-migration:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Check migration file exists
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "cd /opt/spm && docker compose -f infra/docker-compose.prod.yml exec -T backend ls -la backend/migrations/${{ github.event.inputs.migration_script }}"

      - name: Run migration on production
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "cd /opt/spm && docker compose -f infra/docker-compose.prod.yml exec -T backend python -u backend/migrations/${{ github.event.inputs.migration_script }}"

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh/id_rsa
