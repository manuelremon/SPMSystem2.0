name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite deploy manual desde GitHub UI

env:
  DEPLOY_PATH: /opt/spm

jobs:
  # ==================== Run Tests First ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Create data directory
        run: mkdir -p data

      - name: Run backend tests
        env:
          ENV: test
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///data/spm_test.db
          LOG_LEVEL: WARNING
        run: |
          python -m pytest tests/unit/ -v --tb=short \
            --ignore=tests/unit/test_forecast_parallel.py \
            --ignore=tests/unit/test_lstm_model.py \
            --ignore=tests/unit/test_approval_rules.py \
            --ignore=tests/unit/test_dashboard_formulas.py \
            --timeout=60

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --ignore-scripts=false --force

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://planifica-materiales.com

  # ==================== Deploy to Production ====================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Pre-deploy backup
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'BACKUP_SCRIPT'
            set -e

            echo "=== Creating pre-deploy backup ==="
            cd /opt/spm
            BACKUP_DIR="/opt/spm/backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            mkdir -p $BACKUP_DIR

            # Backup SQLite database
            if [ -f data/spm.db ]; then
              cp data/spm.db $BACKUP_DIR/spm_$TIMESTAMP.db
              echo "SQLite backed up to $BACKUP_DIR/spm_$TIMESTAMP.db"
            fi

            # Backup PostgreSQL database
            echo "=== Backing up PostgreSQL ==="
            if docker exec spm-postgres pg_isready -U spm -d spm_production > /dev/null 2>&1; then
              docker exec spm-postgres pg_dump -U spm -d spm_production \
                --format=custom --compress=6 \
                -f /tmp/spm_pg_backup.dump 2>/dev/null && \
              docker cp spm-postgres:/tmp/spm_pg_backup.dump \
                $BACKUP_DIR/spm_pg_$TIMESTAMP.dump && \
              docker exec spm-postgres rm -f /tmp/spm_pg_backup.dump && \
              echo "PostgreSQL backed up to $BACKUP_DIR/spm_pg_$TIMESTAMP.dump" || \
              echo "Warning: PostgreSQL backup failed (non-blocking)"
            else
              echo "PostgreSQL container not running, skipping PG backup"
            fi

            # Save current commit for rollback
            git rev-parse HEAD > $BACKUP_DIR/last_good_commit_$TIMESTAMP.txt
            echo "Current commit saved for rollback"

            # Keep only last 5 backups of each type
            ls -t $BACKUP_DIR/spm_*.db 2>/dev/null | tail -n +6 | xargs -r rm
            ls -t $BACKUP_DIR/spm_pg_*.dump 2>/dev/null | tail -n +6 | xargs -r rm
            ls -t $BACKUP_DIR/last_good_commit_*.txt 2>/dev/null | tail -n +6 | xargs -r rm

            echo "=== Backup completed ==="
          BACKUP_SCRIPT

      - name: Fix permissions
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'PERMISSIONS_SCRIPT'
            echo "=== Fixing file permissions ==="
            cd /opt/spm

            # Fix ownership of project directory (requires sudo)
            sudo chown -R $(whoami):$(whoami) /opt/spm 2>/dev/null || true

            # If sudo not available, try to remove problematic node_modules
            if [ -d "frontend/node_modules" ]; then
              rm -rf frontend/node_modules 2>/dev/null || {
                echo "Warning: Could not remove node_modules, trying with sudo..."
                sudo rm -rf frontend/node_modules 2>/dev/null || true
              }
            fi

            echo "=== Permissions fixed ==="
          PERMISSIONS_SCRIPT

      - name: Update environment variables
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << ENVSCRIPT
            cd /opt/spm

            # Function to update or add env var
            update_env() {
              local key=\$1
              local value=\$2
              if grep -q "^\${key}=" .env 2>/dev/null; then
                sed -i "s|^\${key}=.*|\${key}=\${value}|" .env
                echo "Updated \${key} in .env"
              else
                echo "\${key}=\${value}" >> .env
                echo "Added \${key} to .env"
              fi
            }

            # Update all secrets from GitHub Secrets
            update_env "GOOGLE_AI_API_KEY" "${{ secrets.GOOGLE_AI_API_KEY }}"
            update_env "SECRET_KEY" "${{ secrets.SECRET_KEY }}"
            update_env "JWT_SECRET_KEY" "${{ secrets.JWT_SECRET_KEY }}"
            update_env "POSTGRES_PASSWORD" "${{ secrets.POSTGRES_PASSWORD }}"

            echo "=== Environment variables updated ==="
          ENVSCRIPT

      - name: Deploy code and frontend
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'ENDSSH'
            set -e
            echo "=== Starting deployment ==="
            cd /opt/spm
            echo "=== Pulling latest code ==="
            git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin https://github.com/${{ github.repository }}.git
            echo "=== Building frontend ==="
            cd frontend
            npm ci
            npm run build
            cd ..
            echo "=== Code and frontend deployed ==="
          ENDSSH

      - name: Rebuild and restart Docker containers
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'SCRIPT'
            set -ex
            cd /opt/spm

            # Export all secrets from .env
            echo "=== Exporting environment variables ==="
            set -a
            source .env
            set +a

            # Sync secrets to infra/.env for Docker Compose
            echo "=== Syncing secrets to infra/.env ==="
            echo "POSTGRES_USER=spm" > infra/.env
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> infra/.env
            echo "POSTGRES_DB=spm_production" >> infra/.env
            echo "SECRET_KEY=${SECRET_KEY}" >> infra/.env
            echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}" >> infra/.env
            echo "GOOGLE_AI_API_KEY=${GOOGLE_AI_API_KEY}" >> infra/.env
            echo "CORS_ORIGINS=https://planifica-materiales.com" >> infra/.env
            echo "REDIS_PASSWORD=${REDIS_PASSWORD:-spm_redis_secret}" >> infra/.env
            echo "=== infra/.env updated with all secrets ==="

            echo "=== Pruning old Docker images ==="
            docker image prune -f || true

            # Save iptables rules before Docker changes (Oracle Cloud needs these)
            echo "=== Saving iptables rules ==="
            sudo iptables-save > /tmp/iptables-backup.rules 2>/dev/null || true

            echo "=== Rebuilding backend container ==="
            docker compose -f infra/docker-compose.prod.yml build --no-cache backend

            echo "=== Restarting containers (rolling) ==="
            docker compose -f infra/docker-compose.prod.yml up -d --force-recreate --remove-orphans

            echo "=== Waiting for containers to start ==="
            sleep 20

            # Restore iptables if Docker broke them (Oracle Cloud iptables fix)
            echo "=== Verifying iptables rules ==="
            if ! sudo iptables -L INPUT -n 2>/dev/null | grep -q "ACCEPT.*dpt:443"; then
              echo "WARNING: iptables rules missing, restoring..."
              sudo iptables-restore < /tmp/iptables-backup.rules 2>/dev/null || true
            fi

            # Ensure ports 80/443 are open (Oracle Cloud sometimes needs this)
            sudo iptables -I INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null || true
            sudo iptables -I INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || true
            sudo iptables -I INPUT -p tcp --dport 22 -j ACCEPT 2>/dev/null || true

            echo "=== Container status ==="
            docker compose -f infra/docker-compose.prod.yml ps
            echo "=== Restart completed ==="
          SCRIPT

      - name: Run database migrations
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'MIGRATE_SCRIPT'
            set -e
            echo "=== Running database migrations ==="
            cd /opt/spm

            # Run all pending migrations via migration runner
            docker exec spm-backend python -c "
            import os, sys, importlib.util, logging
            logging.basicConfig(level=logging.INFO)
            logger = logging.getLogger('migration_runner')

            migration_dir = 'backend/migrations'
            files = sorted([f for f in os.listdir(migration_dir) if f.endswith('.py') and f[0].isdigit()])

            # Track applied migrations via schema_migrations table
            from backend.core.db import get_db_connection
            with get_db_connection() as conn:
                cur = conn.cursor()
                cur.execute('''CREATE TABLE IF NOT EXISTS schema_migrations (
                    version TEXT PRIMARY KEY,
                    applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                )''')
                conn.commit()
                cur.execute('SELECT version FROM schema_migrations')
                applied = {r[0] for r in cur.fetchall()}

            for f in files:
                version = f.split('_')[0]
                if version in applied:
                    continue
                logger.info(f'Applying migration {f}...')
                try:
                    spec = importlib.util.spec_from_file_location(f[:-3], os.path.join(migration_dir, f))
                    mod = importlib.util.module_from_spec(spec)
                    spec.loader.exec_module(mod)
                    if hasattr(mod, 'up'):
                        mod.up()
                    with get_db_connection() as conn:
                        cur = conn.cursor()
                        cur.execute('INSERT INTO schema_migrations (version) VALUES (%s)', (version,))
                        conn.commit()
                    logger.info(f'Migration {f} applied successfully')
                except Exception as e:
                    logger.error(f'Migration {f} failed: {e}')
                    # Don't stop on failure - some migrations may already be partially applied
                    continue

            logger.info('All migrations processed')
            " || echo "Migration runner completed with warnings"

            echo "=== Migrations completed ==="
          MIGRATE_SCRIPT

      - name: Show container logs
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'SCRIPT'
            echo "=== Backend container logs ==="
            docker logs spm-backend --tail 100 2>&1 || echo "Could not get logs"
            echo "=== Testing Vertex status ==="
            curl -s http://localhost:5000/api/vertex/status || echo "Vertex not responding"
            curl -s http://localhost:5000/api/health/routes | head -c 500 || echo "Routes endpoint not available"
          SCRIPT

      - name: Health check with retry
        id: health_check
        run: |
          echo "=== Running health checks ==="
          MAX_RETRIES=8
          RETRY_DELAY=15
          HEALTH_URL="https://planifica-materiales.com/api/health"

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i/$MAX_RETRIES..."
            response=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 15 $HEALTH_URL || echo "000")

            if [ "$response" = "200" ]; then
              echo "Health check passed! Site responding with HTTP 200"
              echo "health_status=success" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Received HTTP $response, waiting ${RETRY_DELAY}s before retry..."

            # If connection times out, try to fix iptables via SSH
            if [ "$response" = "000" ] && [ "$i" -ge 3 ]; then
              echo "Connection timeout detected, attempting iptables fix via SSH..."
              ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'FIX_SCRIPT' || true
                sudo iptables -I INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null || true
                sudo iptables -I INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null || true
                sudo systemctl restart docker 2>/dev/null || true
                sleep 10
                cd /opt/spm && docker compose -f infra/docker-compose.prod.yml up -d 2>/dev/null || true
              FIX_SCRIPT
            fi

            sleep $RETRY_DELAY
          done

          echo "Health check failed after $MAX_RETRIES attempts"
          echo "health_status=failed" >> $GITHUB_OUTPUT
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'ROLLBACK_SCRIPT'
            set -e

            echo "=== Starting rollback ==="
            cd /opt/spm
            BACKUP_DIR="/opt/spm/backups"

            # Get last good commit
            LAST_COMMIT=$(ls -t $BACKUP_DIR/last_good_commit_*.txt 2>/dev/null | head -1)
            if [ -f "$LAST_COMMIT" ]; then
              COMMIT_HASH=$(cat "$LAST_COMMIT")
              echo "Rolling back to commit: $COMMIT_HASH"
              git reset --hard $COMMIT_HASH

              # Restore SQLite backup
              LAST_DB=$(ls -t $BACKUP_DIR/spm_*.db 2>/dev/null | head -1)
              if [ -f "$LAST_DB" ]; then
                cp "$LAST_DB" data/spm.db
                echo "SQLite restored from $LAST_DB"
              fi

              # Restore PostgreSQL backup
              LAST_PG=$(ls -t $BACKUP_DIR/spm_pg_*.dump 2>/dev/null | head -1)
              if [ -f "$LAST_PG" ]; then
                docker cp "$LAST_PG" spm-postgres:/tmp/restore.dump && \
                docker exec spm-postgres pg_restore -U spm -d spm_production \
                  --clean --if-exists --no-owner /tmp/restore.dump 2>/dev/null && \
                docker exec spm-postgres rm -f /tmp/restore.dump && \
                echo "PostgreSQL restored from $LAST_PG" || \
                echo "Warning: PostgreSQL restore failed"
              fi

              # Rebuild and restart
              cd frontend && npm install --force && npm run build && cd ..
              docker compose -f infra/docker-compose.prod.yml build backend
              docker compose -f infra/docker-compose.prod.yml up -d

              echo "=== Rollback completed ==="
            else
              echo "No backup found for rollback!"
              exit 1
            fi
          ROLLBACK_SCRIPT

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh/id_rsa

  # ==================== Notify on Failure ====================
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure()

    steps:
      - name: Create failure summary
        run: |
          echo "## Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The deployment to production failed. Please check the workflow logs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

  # ==================== Notify on Success ====================
  notify-success:
    name: Notify on Success
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: success()

    steps:
      - name: Create success summary
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The application has been deployed to production." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://planifica-materiales.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
