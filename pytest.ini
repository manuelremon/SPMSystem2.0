[pytest]
norecursedirs = tests/manual
# Configuración de pytest para Fase 3

# Rutas de tests
testpaths = tests
pythonpath = .

# Patrones de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personalizados
markers =
    unit: Unit tests (servicios, repositorio, cache)
    integration: Integration tests (endpoints HTTP)
    slow: Tests que tardan mucho
    smoke: Smoke tests básicos

# Configuración de output
addopts =
    --strict-markers
    --tb=short
    -ra

# Configuración de coverage
[coverage:run]
source = backend
omit =
    */tests/*
    */site-packages/*
    */__pycache__/*
    */migrations/*
    */agent/pipelines/forecast/*

[coverage:report]
# Coverage threshold: 29.76% actual (2026-02-16). Target: 55%
# Raise gradually as coverage improves
fail_under = 29
show_missing = true
precision = 2
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
